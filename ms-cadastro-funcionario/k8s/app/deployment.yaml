apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cadastro-funcionario
  namespace: github-copilot
  labels:
    app: ms-cadastro-funcionario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-cadastro-funcionario
  template:
    metadata:
      labels:
        app: ms-cadastro-funcionario
    spec:
      containers:
        - name: ms-cadastro-funcionario
          image: ms-cadastro-funcionario:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - configMapRef:
                name: ms-funcionario-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
