apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-scheduler
  namespace: github-copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-scheduler
  namespace: github-copilot
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-scheduler
  namespace: github-copilot
subjects:
  - kind: ServiceAccount
    name: namespace-scheduler
    namespace: github-copilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-scheduler
