apiVersion: batch/v1
kind: CronJob
metadata:
  name: start-github-copilot-namespace
  namespace: github-copilot
  labels:
    app.kubernetes.io/name: start-github-copilot-namespace
spec:
  schedule: "0 7 * * 1-5"  # Seg a Sex às 07:00 (UTC do cluster)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: namespace-scheduler
          restartPolicy: OnFailure
          containers:
            - name: scaler
              image: bitnami/kubectl:1.30
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "[Start] Escalonando Deployments e StatefulSets do namespace 'github-copilot' para 1 replica";
                  kubectl -n github-copilot scale deployment --all --replicas=1 || true;
                  kubectl -n github-copilot scale statefulset --all --replicas=1 || true;
