# Configuração do projeto
sonar.projectKey=ms-cadastro-funcionario
sonar.projectName=Microserviço de Cadastro de Funcionários
sonar.projectVersion=1.0.0

# Diretórios de código fonte
sonar.sources=app
sonar.tests=tests

# Padrões de exclusão
sonar.exclusions=**/migrations/**,**/venv/**,**/__pycache__/**,**/node_modules/**,**/.git/**

# Configuração Python
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-reports/pytest.xml

# Configurações específicas para cobertura
sonar.python.version=3.11
sonar.python.file.suffixes=.py

# Encoding
sonar.sourceEncoding=UTF-8

# Links do projeto
sonar.links.homepage=http://localhost:8000
sonar.links.ci=https://github.com/empresa/ms-cadastro-funcionario
sonar.links.scm=https://github.com/empresa/ms-cadastro-funcionario
sonar.links.issue=https://github.com/empresa/ms-cadastro-funcionario/issues

# Configurações de qualidade
sonar.qualitygate.wait=true
